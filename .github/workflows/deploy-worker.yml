name: Deploy Sphere Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy Sphere Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6fe0a69a604d3b4214eee512955eb35e
        run: wrangler deploy

      - name: Smoke test registration and login
        env:
          API_BASE: https://sphere-api.1234ymarmu.workers.dev
        run: |
          set -euo pipefail
          TEST_EMAIL="sphere-smoke-${GITHUB_RUN_ID}@binancecompany274.com"
          TEST_USERNAME="smoke_${GITHUB_RUN_ID}"
          TEST_PASSWORD="Sphere-${GITHUB_RUN_ID}-Smoke"
          echo "Testing API: ${API_BASE}"
          echo "Test account: ${TEST_EMAIL}"

          REGISTER=$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Origin: https://famous-alfajores-46f9fa.netlify.app' \
            -H 'Content-Type: application/json' \
            -X POST "${API_BASE}/api/auth/register" \
            --data "{\"username\":\"${TEST_USERNAME}\",\"email\":\"${TEST_EMAIL}\",\"password\":\"${TEST_PASSWORD}\",\"displayName\":\"Sphere Smoke Test\"}")
          echo "Registration response received."
          echo "${REGISTER}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||!j.data?.token)process.exit(1);console.log("Registration: PASS")})'

          LOGIN=$(curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Origin: https://famous-alfajores-46f9fa.netlify.app' \
            -H 'Content-Type: application/json' \
            -X POST "${API_BASE}/api/auth/login" \
            --data "{\"identifier\":\"${TEST_EMAIL}\",\"password\":\"${TEST_PASSWORD}\"}")
          echo "${LOGIN}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||!j.data?.token)process.exit(1);console.log("Login: PASS")})'
