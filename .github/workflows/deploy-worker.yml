name: Validate Sphere Worker

# Production deployment is owned by crazy6-des/Web.
# This repository remains the feature/reward engineering source and must not
# automatically deploy the shared `sphere-api` Worker.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Validate reward integrations
        run: npm run test:rewards

      - name: Production build validation
        run: npm run build
