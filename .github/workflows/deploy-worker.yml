name: Deploy Sphere Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Deploy Sphere Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7f66f064a00bf92d839e0b06e15b6420
        run: |
          set -euo pipefail
          wrangler deploy 2>&1 | tee /tmp/sphere-deploy.log
          WORKER_URL="$(grep -oE 'https://sphere-api\.[^[:space:]]+\.workers\.dev' /tmp/sphere-deploy.log | tail -1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "Could not determine deployed Worker URL from Wrangler output."
            exit 1
          fi
          echo "Deployed Worker: $WORKER_URL"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

      - name: Verify public Worker and production frontend CORS
        run: |
          set -euo pipefail
          for ORIGIN in "https://spheres.com.ng" "https://sphereis.netlify.app"; do
            echo "Checking $WORKER_URL/api/health from $ORIGIN"
            curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
              -H "Origin: $ORIGIN" \
              "$WORKER_URL/api/health"
            echo
            echo "Checking browser preflight for $ORIGIN"
            curl --fail --silent --show-error --retry 3 --retry-delay 2 -D /tmp/preflight.headers -o /dev/null \
              -X OPTIONS \
              -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type,authorization' \
              "$WORKER_URL/api/auth/login"
            grep -qi "^access-control-allow-origin: $ORIGIN" /tmp/preflight.headers
            grep -qi '^access-control-allow-credentials: true' /tmp/preflight.headers
          done
          echo "Public Worker + production frontend CORS verification passed."

      - name: Verify production Netlify API proxy
        run: |
          set -euo pipefail
          for FRONTEND in "https://spheres.com.ng" "https://sphereis.netlify.app"; do
            echo "Checking $FRONTEND/api/health"
            curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
              -H "Origin: $FRONTEND" \
              "$FRONTEND/api/health"
            echo
            echo "Checking $FRONTEND/api/earn/providers"
            curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
              -H "Origin: $FRONTEND" \
              "$FRONTEND/api/earn/providers"
            echo
            echo "Checking CORS for $FRONTEND"
            curl --fail --silent --show-error --retry 3 --retry-delay 2 -D /tmp/frontend.headers -o /dev/null \
              -H "Origin: $FRONTEND" \
              "$FRONTEND/api/earn/providers"
            grep -qi "^access-control-allow-origin: $FRONTEND" /tmp/frontend.headers
          done
          echo "Production Netlify -> Cloudflare Worker API proxy verification passed."
