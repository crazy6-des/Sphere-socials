name: Deploy Sphere Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Align Cloudflare workers.dev subdomain with canonical architecture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6fe0a69a604d3b4214eee512955eb35e
          CANONICAL_WORKERS_SUBDOMAIN: binancecompany274
        run: |
          set -euo pipefail
          CURRENT_SUBDOMAIN="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||!j.result?.subdomain)process.exit(1);process.stdout.write(j.result.subdomain)})')"
          echo "Current workers.dev subdomain: ${CURRENT_SUBDOMAIN}"
          if [ "${CURRENT_SUBDOMAIN}" != "${CANONICAL_WORKERS_SUBDOMAIN}" ]; then
            echo "Restoring canonical workers.dev subdomain: ${CANONICAL_WORKERS_SUBDOMAIN}"
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              -X PUT \
              --data "{\"subdomain\":\"${CANONICAL_WORKERS_SUBDOMAIN}\"}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j.success||j.result?.subdomain!==process.env.CANONICAL_WORKERS_SUBDOMAIN)process.exit(1);console.log("Canonical workers.dev subdomain restored.")})'
          else
            echo "Canonical workers.dev subdomain already active."
          fi

      - name: Deploy Sphere Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6fe0a69a604d3b4214eee512955eb35e
        run: |
          set -euo pipefail
          wrangler deploy 2>&1 | tee /tmp/sphere-deploy.log
          WORKER_URL="$(grep -oE 'https://sphere-api\.[^[:space:]]+\.workers\.dev' /tmp/sphere-deploy.log | tail -1 || true)"
          if [ -z "$WORKER_URL" ]; then
            echo "Could not determine deployed Worker URL from Wrangler output."
            exit 1
          fi
          echo "Deployed Worker: $WORKER_URL"
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

      - name: Verify public Worker and Netlify CORS
        run: |
          set -euo pipefail
          echo "Checking $WORKER_URL/api/health"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            -H 'Origin: https://famous-alfajores-46f9fa.netlify.app' \
            "$WORKER_URL/api/health"
          echo
          echo "Checking browser preflight"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 -D /tmp/preflight.headers -o /dev/null \
            -X OPTIONS \
            -H 'Origin: https://famous-alfajores-46f9fa.netlify.app' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' \
            "$WORKER_URL/api/auth/login"
          grep -qi '^access-control-allow-origin: https://famous-alfajores-46f9fa.netlify.app' /tmp/preflight.headers
          grep -qi '^access-control-allow-credentials: true' /tmp/preflight.headers
          echo "Public Worker + Netlify CORS verification passed."
