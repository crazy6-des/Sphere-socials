name: Deploy Sphere Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 6fe0a69a604d3b4214eee512955eb35e
          packageManager: npm
          command: deploy

      - name: Show Wrangler error
        if: always()
        run: |
          echo "===== WRANGLER STDOUT ====="
          echo '${{ steps.deploy.outputs.command-output }}'
          echo "===== WRANGLER STDERR ====="
          echo '${{ steps.deploy.outputs.command-stderr }}'

      - name: Fail if deployment failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
